<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Техника Орск</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&family=Oswald:wght@500;600&display=swap">
<style>
/* Layout: one phone-width app column, centered on wide screens. Tabs: Каталог / Рядом / Кабинет. */
:root{
  --bg:#E4E8EA; --surface:#F6F8F8; --ink:#17232B; --muted:#56666F; --line:#C5CED2;
  --accent:#C93F08; --on-accent:#FFFFFF; --ok:#17744A; --busy:#7A5A00; --water:#BFD3DC; --block:#D5DCDF;
  --f-display:'Oswald','Arial Narrow',sans-serif; --f-body:'IBM Plex Sans','Segoe UI',Arial,sans-serif; --f-mono:'IBM Plex Mono',Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10171B; --surface:#1A252B; --ink:#E7EDF0; --muted:#97A8B1; --line:#2B3A42;
  --accent:#FF7F45; --on-accent:#1A0C04; --ok:#4CC189; --busy:#E0B24A; --water:#22404F; --block:#243239; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10171B; --surface:#1A252B; --ink:#E7EDF0; --muted:#97A8B1; --line:#2B3A42;
  --accent:#FF7F45; --on-accent:#1A0C04; --ok:#4CC189; --busy:#E0B24A; --water:#22404F; --block:#243239; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
.app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--bg)}
header.top{padding:18px 0 10px}
h1{font:600 26px/1.1 var(--f-display);letter-spacing:.02em;text-transform:uppercase;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:13px;margin:4px 0 0}
main{flex:1;padding-bottom:16px;min-width:0}
input,select,button{font:inherit;color:inherit}
input[type=search],input[type=text],input[type=number],select{width:100%;min-height:44px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.cats{display:flex;gap:8px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none}
.chip{flex:none;min-height:40px;padding:6px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer;white-space:nowrap}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px 0}
.filters label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);min-width:0}
.checks{display:flex;gap:16px;flex-wrap:wrap;padding:2px 0 8px}
.checks label{display:flex;gap:8px;align-items:center;min-height:32px}
.count{font:500 12px var(--f-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:6px 0}
.list{display:flex;flex-direction:column;gap:10px}
.card{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;cursor:pointer}
.card h3{font:600 17px/1.2 var(--f-display);letter-spacing:.02em;margin:0;text-transform:uppercase}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.price{font:500 17px var(--f-mono);white-space:nowrap;color:var(--accent)}
.price small{font-size:12px;color:var(--muted)}
.plate{display:inline-block;font:500 12px var(--f-mono);border:1.5px solid var(--ink);border-radius:4px;padding:1px 6px;letter-spacing:.08em}
.meta{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:8px;font-size:13px;color:var(--muted)}
.ok{color:var(--ok);font-weight:600}.busy{color:var(--busy);font-weight:600}
.btn{min-height:46px;border-radius:8px;border:1px solid var(--ink);background:transparent;padding:8px 16px;cursor:pointer;font-weight:600;text-align:center;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.btn.main{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}
.back{background:none;border:0;padding:12px 0;cursor:pointer;color:var(--muted);min-height:44px}
dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:12px 0}
dt{color:var(--muted)}dd{margin:0}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button{min-height:44px;border:1px solid var(--line);background:var(--surface);border-radius:8px;cursor:pointer;font-size:13px}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
h2{font:600 18px var(--f-display);text-transform:uppercase;letter-spacing:.03em;margin:18px 0 6px}
.note{font-size:12.5px;color:var(--muted);margin:8px 0}
.map{width:100%;height:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface);display:block}
.map g[data-id]{cursor:pointer}
.map text{font-family:var(--f-body);fill:var(--muted);font-size:10px}
form.add{display:grid;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px}
form.add label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.sw{display:flex;align-items:center;gap:10px;min-height:44px}
nav.tabs{position:sticky;bottom:0;display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)))}
nav.tabs button{min-height:54px;border:0;background:none;cursor:pointer;font:600 13px var(--f-display);text-transform:uppercase;letter-spacing:.03em;color:var(--muted)}
nav.tabs button[aria-current=page]{color:var(--accent);box-shadow:inset 0 3px 0 var(--accent)}
#toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;max-width:90vw;font-size:14px;z-index:20}
.msgs{display:flex;flex-direction:column;gap:6px;max-height:50vh;overflow-y:auto;padding:8px 0}
.bub{align-self:flex-start;max-width:80%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;overflow-wrap:anywhere}
.bub.me{align-self:flex-end;background:var(--ink);color:var(--bg);border-color:var(--ink)}
.bub small{display:block;font-size:11px;opacity:.7;margin-top:2px}
.chatform{display:flex;gap:8px;margin-top:8px}.chatform input{flex:1;min-width:0}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .15s}.card:hover{border-color:var(--accent)}}
body{margin:0}[hidden]{display:none!important}
</style>

</head>
<body>
<div class="app">
  <header class="top"><div class="row" style="align-items:center"><h1>Техника Орск</h1><button class="chip" id="theme" type="button"></button></div><p class="sub">Самосвалы, экскаваторы и вывоз мусора рядом с вами. Демо-версия. Примеры выдуманы, оплата тестовая: деньги не списываются.</p></header>
  <main id="main"></main>
  <nav class="tabs" aria-label="Разделы">
    <button data-tab="catalog">Каталог</button><button data-tab="near">Рядом</button><button data-tab="orders">Заказы</button><button data-tab="chats">Чаты</button><button data-tab="owner">Кабинет</button>
  </nav>
</div>
<div id="toast" role="status" hidden></div>

<script>
const TYPES={samosval:'Самосвал',musor:'Вывоз мусора',excav:'Экскаватор',manip:'Манипулятор',gruz:'Грузоперевозки',pogruz:'Погрузчик'};
const DISTRICTS=['Ленинский','Октябрьский','Советский','Новотроицк'];
const ME={x:180,y:150}; // «Вы» на схеме
let nextId=20;
let DB=null,MY=null; // DB: общая база страницы, MY: мой id; без них работает локально
const MINE=i=>i.ownerId&&i.ownerId===(MY||'local');
let orders=[],msgs=[],profile={name:'',phone:'',role:'owner'};const FEE=0.05; // комиссия сервиса
let items=[
 {id:1,type:'samosval',title:'КамАЗ 65115, 15 т',owner:'ИП Сергеев',plate:'А 214 ВС 56',price:2200,unit:'час',driver:true,district:'Ленинский',avail:true,live:true,upd:4,x:210,y:120,phone:'+7 (3537) 00-00-01',desc:'Песок, щебень, ПГС, грунт. Работаем по городу и пригороду.',zone:'Орск, Новотроицк'},
 {id:2,type:'samosval',title:'Shacman 6×4, 25 т',owner:'ТрансСтрой',plate:'К 078 ОР 56',price:3500,unit:'рейс',driver:true,district:'Советский',avail:false,live:true,upd:12,x:70,y:200,phone:'+7 (3537) 00-00-02',desc:'Крупные объёмы: щебень, отсев, скальный грунт.',zone:'Орск и область'},
 {id:3,type:'musor',title:'Вывоз мусора, КамАЗ 20 м³',owner:'ЧистоДвор',plate:'Т 305 НХ 56',price:4500,unit:'рейс',driver:true,district:'Октябрьский',avail:true,live:true,upd:2,x:290,y:90,phone:'+7 (3537) 00-00-03',desc:'Строительный мусор, ветки, старая мебель. Погрузка силами заказчика или по договорённости.',zone:'Орск'},
 {id:4,type:'musor',title:'Газель, мусор до 3 т',owner:'ИП Алиев',plate:'Е 912 КМ 56',price:1800,unit:'рейс',driver:true,district:'Ленинский',avail:true,live:false,upd:null,x:150,y:80,phone:'+7 (3537) 00-00-04',desc:'Небольшие объёмы после ремонта. Можно с грузчиками.',zone:'Орск'},
 {id:5,type:'excav',title:'JCB 3CX, экскаватор-погрузчик',owner:'Мастер-Копка',plate:'АВ 4471 56',price:2600,unit:'час',driver:true,district:'Советский',avail:true,live:true,upd:7,x:110,y:170,phone:'+7 (3537) 00-00-05',desc:'Траншеи, котлованы, планировка участка. Минимальный заказ 3 часа.',zone:'Орск, Гай'},
 {id:6,type:'excav',title:'Гусеничный Hitachi ZX200',owner:'ИП Кузнецов',plate:'ВС 1203 56',price:3200,unit:'час',driver:false,district:'Октябрьский',avail:true,live:false,upd:null,x:250,y:200,phone:'+7 (3537) 00-00-06',desc:'Без водителя, нужен допуск к управлению. Перевозка на трале отдельно.',zone:'Орск'},
 {id:7,type:'manip',title:'Манипулятор Isuzu, 5 т',owner:'ГрузМастер',plate:'М 640 УА 56',price:2400,unit:'час',driver:true,district:'Ленинский',avail:false,live:true,upd:21,x:200,y:190,phone:'+7 (3537) 00-00-07',desc:'Доставка и разгрузка плит, блоков, пиломатериала.',zone:'Орск'},
 {id:8,type:'gruz',title:'Газель Next, борт 3 м',owner:'ИП Ильин',plate:'О 117 ТТ 56',price:900,unit:'час',driver:true,district:'Ленинский',avail:true,live:true,upd:1,x:165,y:140,phone:'+7 (3537) 00-00-08',desc:'Переезды, мебель, стройматериалы. Подача по городу от 30 минут.',zone:'Орск'},
 {id:9,type:'pogruz',title:'Фронтальный погрузчик Amkodor',owner:'База «Строй-Орск»',plate:'АК 2288 56',price:2000,unit:'смена',driver:true,district:'Новотроицк',avail:true,live:false,upd:null,x:320,y:240,phone:'+7 (3537) 00-00-09',desc:'Погрузка сыпучих материалов, расчистка площадок.',zone:'Новотроицк, Орск'}
];
const S={tab:'catalog',cat:'all',q:'',district:'',driver:false,free:false,unit:'',max:'',sort:'dist',open:null,qty:1,chat:null,draft:'',marks:{}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=n=>n.toLocaleString('ru-RU')+' ₽';
const km=i=>Math.max(0.3,Math.round(Math.hypot(i.x-ME.x,i.y-ME.y)/30*10)/10);
const kmTxt=i=>km(i).toString().replace('.',',')+' км';
let tt;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,2600)}

function filtered(){
 const q=S.q.trim().toLowerCase();
 const r=items.filter(i=>(S.cat==='all'||i.type===S.cat)&&(!S.district||i.district===S.district)&&(!S.driver||i.driver)&&(!S.free||i.avail)
  &&(!q||(i.title+' '+TYPES[i.type]+' '+i.desc).toLowerCase().includes(q))
  &&(!S.unit||i.unit===S.unit)&&(!S.unit||!S.max||i.price<=+S.max));
 return r.sort(S.sort==='price'&&S.unit?(a,b)=>a.price-b.price:(a,b)=>km(a)-km(b));
}
function cardHtml(i){
 return `<button class="card" data-open="${i.id}"><div class="row"><div><h3>${esc(i.title)}</h3><span class="plate">${esc(i.plate)}</span></div>
 <div class="price">${money(i.price)}<small> / ${i.unit}</small></div></div>
 <div class="meta"><span class="${i.avail?'ok':'busy'}">${i.avail?'Доступна':'Занята'}</span><span>${i.driver?'С водителем':'Без водителя'}</span><span>${esc(i.district)}</span><span>${kmTxt(i)}</span></div></button>`;
}
function catalog(){
 const cats=[['all','Все'],...Object.entries(TYPES)];
 const list=filtered();
 return `<div class="cats" role="group" aria-label="Категория">${cats.map(([k,v])=>`<button class="chip" data-cat="${k}" aria-pressed="${S.cat===k}">${v}</button>`).join('')}</div>
 <input type="search" id="q" placeholder="Что нужно сделать? Например, щебень" value="${esc(S.q)}" aria-label="Поиск">
 <div class="filters">
  <label>Район<select id="district"><option value="">Все районы</option>${DISTRICTS.map(d=>`<option ${S.district===d?'selected':''}>${d}</option>`).join('')}</select></label>
  <label>Тариф<select id="unit"><option value="">Любой</option>${['час','рейс','смена'].map(u=>`<option value="${u}" ${S.unit===u?'selected':''}>за ${u}</option>`).join('')}</select></label>
  <label>Цена до, ₽<input type="number" id="max" inputmode="numeric" min="0" value="${esc(S.max)}" ${S.unit?'':'disabled'} placeholder="${S.unit?'например 3000':'выберите тариф'}"></label>
  <label>Сортировка<select id="sort"><option value="dist" ${S.sort==='dist'?'selected':''}>Сначала ближе</option><option value="price" ${S.sort==='price'?'selected':''} ${S.unit?'':'disabled'}>Сначала дешевле</option></select></label>
 </div>
 <div class="checks"><label><input type="checkbox" id="driver" ${S.driver?'checked':''}> С водителем</label><label><input type="checkbox" id="free" ${S.free?'checked':''}> Только доступные</label></div>
 <div class="count">Найдено: ${list.length}</div>
 <div class="list">${list.map(cardHtml).join('')||'<p class="note">Ничего не найдено. Снимите часть фильтров.</p>'}</div>`;
}
function detail(i){
 const m=S.marks[i.id];
 return `<button class="back" data-back>← К списку</button>
 <div class="row"><div><h2 style="margin-top:0">${esc(i.title)}</h2><span class="plate">${esc(i.plate)}</span></div><div class="price">${money(i.price)}<small> / ${i.unit}</small></div></div>
 <p>${esc(i.desc)}</p>
 <dl><dt>Тип</dt><dd>${TYPES[i.type]}</dd><dt>Водитель</dt><dd>${i.driver?'Есть':'Нет, нужен свой'}</dd><dt>Статус</dt><dd class="${i.avail?'ok':'busy'}">${i.avail?'Доступна':'Временно занята'} (отмечает владелец)</dd>
 <dt>Район</dt><dd>${esc(i.district)}, ${kmTxt(i)} от вас</dd><dt>Зона работы</dt><dd>${esc(i.zone)}</dd><dt>Владелец</dt><dd>${esc(i.owner)}</dd>
 <dt>Позиция</dt><dd>${i.live?`передаётся с согласия водителя, обновлено ${i.upd} мин назад`:'не передаётся'}</dd></dl>
 <div class="btns"><a class="btn main" href="tel:${i.phone.replace(/[^\d+]/g,'')}">Позвонить</a>${MINE(i)?'<span></span>':`<button class="btn" data-chat="${i.id}|${i.ownerId}">Написать в чате</button>`}</div>
 <p class="note">Номер: <b class="plate" style="border:0;padding:0">${esc(i.phone)}</b> <button class="back" style="padding:0 6px;min-height:32px" data-copy="${esc(i.phone)}">копировать</button><br>Время, адрес, объём и оплату вы согласуете с владельцем напрямую. Сервис платёж не принимает.</p>
 ${orderBlock(i)}<h2>Чем закончилось обращение?</h2>
 <div class="seg" role="group">${[['called','Связался'],['done','Заказ выполнен'],['fail','Не состоялся']].map(([k,v])=>`<button data-mark="${i.id}:${k}" aria-pressed="${m===k}">${v}</button>`).join('')}</div>
 <p class="note">Отметка помогает владельцу и сервису видеть спрос. Оплату она не подтверждает.</p>`;
}
function near(){
 const live=items.filter(i=>i.live).sort((a,b)=>km(a)-km(b));
 const pins=live.map((i,n)=>`<g data-id="${i.id}" tabindex="0" role="button" aria-label="${esc(i.title)}"><circle cx="${i.x}" cy="${i.y}" r="9" fill="${i.avail?'var(--accent)':'var(--muted)'}" stroke="var(--surface)" stroke-width="2"/><text x="${i.x}" y="${i.y+3.5}" text-anchor="middle" style="fill:var(--on-accent);font-weight:600;font-size:9px">${n+1}</text></g>`).join('');
 const list=live;
 return `<h2 style="margin-top:6px">Техника рядом с вами</h2>
 <svg class="map" viewBox="0 0 360 280" role="img" aria-label="Схема Орска с отметками техники">
  <rect x="14" y="14" width="96" height="70" rx="6" fill="var(--block)"/><rect x="130" y="22" width="110" height="60" rx="6" fill="var(--block)"/><rect x="260" y="20" width="84" height="90" rx="6" fill="var(--block)"/>
  <rect x="20" y="104" width="80" height="60" rx="6" fill="var(--block)"/><rect x="120" y="100" width="150" height="34" rx="6" fill="var(--block)"/><rect x="284" y="130" width="60" height="70" rx="6" fill="var(--block)"/>
  <path d="M0 215 C90 190 140 255 230 228 S330 180 360 190 L360 280 L0 280Z" fill="var(--water)"/>
  <text x="26" y="262">р. Урал</text><text x="18" y="30">Советский</text><text x="136" y="38">Ленинский</text><text x="266" y="36">Октябрьский</text><text x="300" y="268">к Новотроицку →</text>
  <circle cx="${ME.x}" cy="${ME.y}" r="7" fill="none" stroke="var(--ink)" stroke-width="2.5"/><circle cx="${ME.x}" cy="${ME.y}" r="2.5" fill="var(--ink)"/><text x="${ME.x+10}" y="${ME.y+4}" style="fill:var(--ink);font-weight:600">Вы</text>
  ${pins}</svg>
 <p class="note">Схема для примера, не настоящая карта. Оранжевые отметки: доступна, серые: занята. Показаны только водители, которые сами включили передачу позиции. Позиция не говорит, что техника свободна или едет к вам.</p>
 <div class="list">${list.map((i,n)=>`<button class="card" data-open="${i.id}"><div class="row"><div><h3>${n+1}. ${esc(i.title)}</h3></div><div class="price" style="font-size:15px">${kmTxt(i)}</div></div><div class="meta"><span class="${i.avail?'ok':'busy'}">${i.avail?'Доступна':'Занята'}</span><span>обновлено ${i.upd} мин назад</span></div></button>`).join('')}</div>`;
}
function owner(){
 const mine=items.filter(MINE);
 return `<h2 style="margin-top:6px">Мой профиль</h2>
 ${profile.name||profile.phone?'':'<p class="note">Заполните профиль, и название с телефоном будут подставляться в новые карточки.</p>'}
 <form class="add" id="profileForm">
  <label>Название или ИП<input type="text" id="pf-name" maxlength="40" value="${esc(profile.name)}"></label>
  <label>Телефон<input type="text" id="pf-phone" maxlength="20" inputmode="tel" value="${esc(profile.phone)}"></label>
  <label>Кто вы<select id="pf-role">${[['customer','Заказчик'],['owner','Владелец техники'],['driver','Водитель']].map(([k,v])=>`<option value="${k}" ${profile.role===k?'selected':''}>${v}</option>`).join('')}</select></label>
  <button class="btn" type="submit">Сохранить профиль</button>
  <p class="note" style="margin:0">Эти данные видите только вы. В карточке они появятся, только когда вы сами её опубликуете.</p>
 </form>
 <h2>Мои карточки</h2>
 <p class="note">Заказчики видят только карточки со статусом «Доступна». Статус меняете вы или назначенный водитель.</p>
 ${mine.length?'':'<p class="note">У вас пока нет карточек. Добавьте первую ниже.</p>'}<div class="list">${mine.map(i=>`<div class="card" style="cursor:default"><div class="row"><div><h3>${esc(i.title)}</h3><span class="plate">${esc(i.plate)}</span></div><div class="price">${money(i.price)}<small> / ${i.unit}</small></div></div>
  <label class="sw"><input type="checkbox" data-avail="${i.id}" ${i.avail?'checked':''}> <span class="${i.avail?'ok':'busy'}">${i.avail?'Доступна':'Временно недоступна'}</span></label>
  <div class="row" style="gap:8px;margin-top:6px;align-items:flex-end"><label style="flex:1;font-size:12px;color:var(--muted)">Цена, ₽<input type="number" id="pr-${i.id}" data-price="${i.id}" min="1" value="${i.price}"></label><button class="btn" data-del="${i.id}">Удалить</button></div>
  </div>`).join('')}</div>
 <h2>Добавить технику</h2>
 <form class="add" id="addForm">
  <label>Тип<select id="f-type">${Object.entries(TYPES).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></label>
  <label>Модель и характеристики<input type="text" id="f-title" required maxlength="60" placeholder="Например, ЗИЛ 4500, 5 т"></label>
  <label>Название или ИП<input type="text" id="f-owner" maxlength="40" value="${esc(profile.name)}" placeholder="Например, ИП Петров"></label>
  <label>Телефон для заказчиков<input type="text" id="f-phone" required maxlength="20" inputmode="tel" value="${esc(profile.phone)}" placeholder="+7 000 000-00-00"></label>
  <label>Гос. номер<input type="text" id="f-plate" maxlength="14" placeholder="А 000 АА 56"></label>
  <label>Цена, ₽<input type="number" id="f-price" required min="1" inputmode="numeric"></label>
  <label>Тариф<select id="f-unit"><option>час</option><option>рейс</option><option>смена</option></select></label>
  <label>Район<select id="f-district">${DISTRICTS.map(d=>`<option>${d}</option>`).join('')}</select></label>
  <label class="sw" style="flex-direction:row;font-size:15px;color:var(--ink)"><input type="checkbox" id="f-driver" checked> Предоставляю водителя</label>
  <button class="btn main" type="submit">Опубликовать карточку</button>
  <p class="note" style="margin:0">Телефон увидят все, кто открыл страницу. Фотографии и проверка администратором появятся позже.</p>
 </form>
 <p class="note">Водитель получает назначенные заказы в своём приложении и сам решает, передавать ли позицию.</p>`;
}
function saveMine(){ // все мои карточки лежат одним документом cards/<мой id>; чужой документ база не даст изменить
 if(!DB||!MY)return Promise.resolve();
 return DB.doc('cards/'+MY).set({items:items.filter(i=>i.ownerId===MY).map(({ownerId,...r})=>r)});
}
function edit(id,patch){const it=items.find(x=>String(x.id)===id);if(!it||!MINE(it))return;Object.assign(it,patch);if(DB)saveMine().catch(()=>toast('Не удалось сохранить'))}
function del(id){const it=items.find(x=>String(x.id)===id);if(!it||!MINE(it))return;items=items.filter(x=>x!==it);if(DB)saveMine().catch(()=>toast('Не удалось удалить'))}
function saveOrders(fn){ // fn получает мои заказы как заказчика и возвращает новый список
 const cid=MY||'local',prev=orders;
 if(DB&&!MY){toast('Чтобы оплатить, войдите в Claude');return}
 const next=fn(orders.filter(o=>o.customerId===cid).map(({customerId,...r})=>r));
 orders=[...orders.filter(o=>o.customerId!==cid),...next.map(o=>({...o,customerId:cid}))];
 render();
 if(DB)DB.doc('orders/'+MY).set({list:next}).catch(()=>{orders=prev;toast('Не удалось сохранить заказ');render()});
}
function pay(id){
 const i=items.find(x=>String(x.id)===id);if(!i||MINE(i)||!i.avail)return;
 const total=i.price*S.qty,fee=Math.round(total*FEE);
 S.open=null;S.tab='orders';
 saveOrders(l=>[{id:'o'+Date.now().toString(36),itemId:String(i.id),title:i.title,ownerId:i.ownerId,qty:S.qty,unit:i.unit,total,fee,payout:total-fee,status:'held',ts:Date.now()},...l]);
 toast('Оплата удержана сервисом (тест)');
}
function release(oid){saveOrders(l=>l.map(o=>o.id===oid?{...o,status:'released'}:o));toast('Выплата владельцу оформлена (тест)')}
function orderBlock(i){
 if(MINE(i))return '';
 if(!i.avail)return '<p class="note">Сейчас занята, заказ через сервис недоступен.</p>';
 const total=i.price*S.qty,fee=Math.round(total*FEE);
 return `<h2>Заказать через сервис</h2>
 <label style="display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)">Сколько: ${i.unit}<input type="number" id="qty" min="1" value="${S.qty}"></label>
 <dl><dt>Итого</dt><dd>${money(total)}</dd><dt>Владельцу после работы</dt><dd>${money(total-fee)}</dd><dt>Комиссия сервиса 5%</dt><dd>${money(fee)}</dd></dl>
 <button class="btn main" style="width:100%" data-pay="${i.id}">Оплатить ${money(total)}</button>
 <p class="note">Тестовый режим: деньги никуда не списываются. В рабочей версии сумма будет удерживаться сервисом и уходить владельцу только после вашего подтверждения, что работа выполнена.</p>`;
}
function ordersTab(){
 const cid=MY||'local',by=(a,b)=>b.ts-a.ts;
 const asC=orders.filter(o=>o.customerId===cid).sort(by),asO=orders.filter(o=>o.ownerId===cid&&o.customerId!==cid).sort(by);
 const row=(o,c)=>`<div class="card" style="cursor:default"><div class="row"><div><h3>${esc(o.title)}</h3><span class="note" style="margin:0">${o.qty} × ${o.unit}</span></div><div class="price">${money(o.total)}</div></div>
  <div class="meta"><span class="${o.status==='held'?'busy':'ok'}">${o.status==='held'?'Деньги удержаны сервисом':'Выплачено владельцу'}</span><span>владельцу ${money(o.payout)}</span><span>комиссия ${money(o.fee)}</span></div>
  ${c&&o.status==='held'?`<button class="btn main" style="width:100%;margin-top:10px" data-release="${o.id}">Работа выполнена, выплатить владельцу</button>`:''}
  ${!c&&o.status==='held'?'<p class="note">Деньги придут после того, как заказчик подтвердит выполнение работы.</p>':''}</div>`;
 const list=(a,c,empty)=>a.length?`<div class="list">${a.map(o=>row(o,c)).join('')}</div>`:`<p class="note">${empty}</p>`;
 return `<h2 style="margin-top:6px">Мои заказы</h2>${list(asC,true,'Заказов нет. Откройте карточку техники и нажмите «Оплатить».')}
 <h2>Заказы мне как владельцу</h2>${list(asO,false,'Пока нет.')}
 <p class="note">Тестовый режим: деньги не списываются и не выплачиваются. Для настоящих платежей нужен платёжный сервис с безопасной сделкой.</p>`;
}
function send(text){ // shortcut: хранится 200 последних сообщений автора на все диалоги; нужно больше: делить по диалогам
 text=text.trim().slice(0,500);if(!text)return;
 if(DB&&!MY){toast('Чтобы писать, войдите в Claude');return}
 const me=MY||'local',c=S.chat,prev=msgs;
 const mine=[...msgs.filter(x=>x.from===me).map(({from,...r})=>r),{id:'m'+Date.now().toString(36),to:c.with,itemId:c.itemId,text,ts:Date.now()}].slice(-200);
 msgs=[...msgs.filter(x=>x.from!==me),...mine.map(x=>({...x,from:me}))];
 S.draft='';render();
 if(DB)DB.doc('chats/'+MY).set({msgs:mine}).catch(()=>{msgs=prev;toast('Не удалось отправить. Нужен доступ «Участник» к странице');render()});
}
function chatView(){
 const c=S.chat,me=MY||'local',it=items.find(x=>String(x.id)===c.itemId);
 const th=msgs.filter(m=>m.itemId===c.itemId&&((m.from===me&&m.to===c.with)||(m.from===c.with&&m.to===me))).sort((a,b)=>a.ts-b.ts);
 const tm=ts=>new Date(ts).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
 return `<button class="back" data-chatback>← Назад</button>
 <h2 style="margin-top:0">${esc(it?it.title:'Карточка удалена')}</h2>
 <p class="note">Сообщения видят все, кто открыл эту страницу. Не пишите здесь адреса и документы.${c.with==='demo'?' Это демо-карточка, ответа не будет.':''}</p>
 <div id="msgs" class="msgs">${th.map(m=>`<div class="bub ${m.from===me?'me':''}">${esc(m.text)}<small>${tm(m.ts)}</small></div>`).join('')||'<p class="note">Сообщений пока нет. Напишите первым.</p>'}</div>
 <form id="chatForm" class="chatform"><input type="text" id="chat-text" maxlength="500" autocomplete="off" aria-label="Сообщение" placeholder="Ваше сообщение" value="${esc(S.draft)}"><button class="btn main" type="submit">Отправить</button></form>`;
}
function chatsTab(){
 const me=MY||'local',g={};
 msgs.filter(m=>m.from===me||m.to===me).forEach(m=>{const k=m.itemId+'|'+(m.from===me?m.to:m.from);if(!g[k]||g[k].ts<m.ts)g[k]=m});
 const rows=Object.entries(g).sort((a,b)=>b[1].ts-a[1].ts);
 return `<h2 style="margin-top:6px">Диалоги</h2>${rows.length?`<div class="list">${rows.map(([k,m])=>{const it=items.find(x=>String(x.id)===m.itemId);
  return `<button class="card" data-chat="${esc(k)}"><h3>${esc(it?it.title:'Карточка удалена')}</h3><div class="meta"><span>${m.from===me?'Вы: ':''}${esc(m.text.slice(0,60))}</span></div></button>`}).join('')}</div>`:'<p class="note">Диалогов нет. Откройте карточку техники и нажмите «Написать в чате».</p>'}`;
}
function saveProfile(){
 const v=id=>document.getElementById(id).value.trim();
 const p={name:v('pf-name').slice(0,40),phone:v('pf-phone').slice(0,20),role:v('pf-role')},prev=profile;
 if(DB&&!MY){toast('Чтобы сохранить профиль, войдите в Claude');return}
 profile=p;S.reset=true;render();
 if(DB)DB.doc('data/users/'+MY+'/profile').set(p).then(()=>toast('Профиль сохранён')).catch(()=>{profile=prev;toast('Не удалось сохранить профиль');render()});
 else toast('Профиль сохранён только на этом экране');
}
function render(){
 const keep={};document.querySelectorAll('#main [id^="f-"],#main [id^="pf-"]').forEach(n=>keep[n.id]=n.type==='checkbox'?n.checked:n.value); // чтобы обновление данных не стирало то, что человек печатает
 const f=document.activeElement,id=f&&f.id,pos=f&&f.selectionStart;
 const main=document.getElementById('main');
 const i=S.open&&items.find(x=>String(x.id)===S.open);
 main.innerHTML=S.chat?chatView():i?detail(i):S.tab==='catalog'?catalog():S.tab==='near'?near():S.tab==='orders'?ordersTab():S.tab==='chats'?chatsTab():owner();
 document.querySelectorAll('nav.tabs button').forEach(b=>{if(b.dataset.tab===S.tab)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
 if(!S.reset)for(const k in keep){const n=document.getElementById(k);if(n){if(n.type==='checkbox')n.checked=keep[k];else n.value=keep[k]}}
 S.reset=false;
 const mb=document.getElementById('msgs');if(mb)mb.scrollTop=mb.scrollHeight;
 if(id){const n=document.getElementById(id);if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(e){}}}
}
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-tab],[data-cat],[data-open],[data-back],[data-mark],[data-copy],[data-chat],[data-chatback],[data-id],[data-pay],[data-release],[data-del]');if(!t)return;
 const d=t.dataset;
 if(d.tab){S.tab=d.tab;S.open=null;S.chat=null;scrollTo(0,0)}
 else if(d.cat){S.cat=d.cat}
 else if(d.open){S.open=d.open;scrollTo(0,0)}
 else if(d.id){S.open=d.id;scrollTo(0,0)}
 else if('back' in d){S.open=null}
 else if(d.pay){pay(d.pay);return}
 else if(d.release){release(d.release);return}
 else if(d.del){del(d.del)}
 else if(d.mark){const k=d.mark.lastIndexOf(':'),a=d.mark.slice(0,k),b=d.mark.slice(k+1);S.marks[a]=b;toast('Отметка сохранена (в демо только на этом экране)')}
 else if(d.copy){navigator.clipboard.writeText(d.copy).then(()=>toast('Номер скопирован')).catch(()=>toast('Номер: '+d.copy));return}
 else if(d.chat){const k=d.chat.split('|');S.chat={itemId:k[0],with:k[1]};S.draft=''}
 else if('chatback' in d){S.chat=null}
 render();
});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('.map g[data-id]')){e.preventDefault();S.open=e.target.dataset.id;render()}});
document.addEventListener('input',e=>{const t=e.target;
 if(t.id==='q'){S.q=t.value;render()}
 else if(t.id==='max'){S.max=t.value;render()}
 else if(t.id==='chat-text'){S.draft=t.value}
 else if(t.id==='qty'){S.qty=Math.max(1,Math.round(+t.value)||1);render()}});
document.addEventListener('change',e=>{const t=e.target;
 if(t.id==='district')S.district=t.value;
 else if(t.id==='unit'){S.unit=t.value;if(!S.unit){S.max='';S.sort='dist'}}
 else if(t.id==='sort')S.sort=t.value;
 else if(t.id==='driver')S.driver=t.checked;
 else if(t.id==='free')S.free=t.checked;
 else if(t.dataset.avail){edit(t.dataset.avail,{avail:t.checked})}
 else if(t.dataset.price){edit(t.dataset.price,{price:Math.max(1,+t.value||1)})}
 else return;
 render();
});
document.addEventListener('submit',e=>{
 if(e.target.id==='profileForm'){e.preventDefault();saveProfile();return}
 if(e.target.id==='chatForm'){e.preventDefault();send(S.draft);return}
 if(e.target.id!=='addForm')return;e.preventDefault();S.reset=true;
 const v=id=>document.getElementById(id).value.trim();
 const it={type:v('f-type'),title:v('f-title'),owner:v('f-owner')||'Владелец',ownerId:MY||'local',plate:v('f-plate')||'без номера',price:+v('f-price'),unit:v('f-unit'),
  driver:document.getElementById('f-driver').checked,district:v('f-district'),avail:true,live:false,upd:null,x:ME.x+40,y:ME.y+30,phone:v('f-phone'),desc:'Описание появится после заполнения профиля.',zone:'Орск'};
 it.id='c'+Date.now().toString(36);
 if(DB){if(!MY){toast('Чтобы публиковать, войдите в Claude');return}
  const prev=items;items=[it,...items];
  saveMine().then(()=>toast('Карточка опубликована')).catch(()=>{items=prev;toast('Не удалось сохранить. Нужен доступ «Участник» к странице');render()});render();return}
 items.unshift(it);toast('Карточка добавлена, но только на этом экране');
 render();
});
const THEMES=[['','Авто'],['light','Светлая'],['dark','Тёмная']];
let th=0;try{th=Math.max(0,THEMES.findIndex(t=>t[0]===localStorage.getItem('theme')))}catch(e){}
function applyTheme(){const[v,l]=THEMES[th],r=document.documentElement;if(v)r.dataset.theme=v;else delete r.dataset.theme;document.getElementById('theme').textContent='Тема: '+l.toLowerCase()}
document.getElementById('theme').onclick=()=>{th=(th+1)%3;applyTheme();try{localStorage.setItem('theme',THEMES[th][0])}catch(e){}};
applyTheme();
render();
(async()=>{try{
 const c=window.claude;if(!c)return;
 const [db,user]=await Promise.all([c.use('db'),c.use('user')]);
 if(user)MY=await user.id();
 if(db){DB=db;
  if(MY)db.doc('data/users/'+MY+'/profile').onSnapshot(sn=>{if(sn.exists){profile={...profile,...sn.data()};render()}},()=>{}); // личный раздел: его видит только сам человек
  db.collection('cards').onSnapshot(sn=>{if(sn.size||!sn.metadata.fromCache){items=sn.docs.flatMap(d=>(d.data().items||[]).map(c=>({...c,ownerId:d.id})));render()}},()=>{DB=null}); // ownerId берём из id документа, не из данных
  db.collection('orders').onSnapshot(sn=>{orders=sn.docs.flatMap(d=>(d.data().list||[]).map(o=>({...o,customerId:d.id})));render()},()=>{});
  db.collection('chats').onSnapshot(sn=>{msgs=sn.docs.flatMap(d=>(d.data().msgs||[]).map(m=>({...m,from:d.id})));render()},()=>{})}
 else render();
}catch(e){}})();
</script>

</body>
</html>
